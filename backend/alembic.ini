# Alembic configuration file.
# Run from backend/ directory: poetry run alembic <command>

[alembic]
# Path to migration scripts, relative to this file (backend/).
script_location = alembic

# Migration filename template: YYYYMMDD_HHMM_<revid>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Add backend/ to sys.path so `from app...` imports resolve in env.py.
prepend_sys_path = .

# Timestamps in filenames use UTC.
timezone = UTC

# Limit slug length in filenames.
truncate_slug_length = 60

# ---------------------------------------------------------------------------
# Database URL — placeholder only.
# env.py reads DATABASE_URL from app.core.config.Settings at runtime.
# This value is never used directly by the application.
# ---------------------------------------------------------------------------
sqlalchemy.url = postgresql+asyncpg://propiq:propiq@localhost:5432/propiq

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
