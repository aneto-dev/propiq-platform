services:

  # ------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 — test database
  #
  # Runs on port 5433 to avoid conflicting with the dev database.
  # No pgAdmin — test database is accessed programmatically only.
  # No persistent volume — data is ephemeral by design.
  #
  # Used by: make test-int, make test
  # TEST_DATABASE_URL=postgresql+asyncpg://propiq:propiq@localhost:5433/propiq_test
  # ------------------------------------------------------------------
  postgres_test:
    image: postgis/postgis:16-3.4
    container_name: propiq_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: propiq
      POSTGRES_PASSWORD: propiq
      POSTGRES_DB: propiq_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propiq -d propiq_test"]
      interval: 5s
      timeout: 5s
      retries: 5
