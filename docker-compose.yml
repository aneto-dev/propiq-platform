services:

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile

    container_name: propiq-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

  postgres:
    image: postgres:16

    container_name: propiq-postgres

    environment:
      POSTGRES_DB: propiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: propiq-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: